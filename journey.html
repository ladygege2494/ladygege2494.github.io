    <style>
        body {
            background: #27AE60;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            overflow-y: auto;
        }
        .journey-container {
            max-width: 1200px;
            width: 100%;
            text-align: center;
            margin-bottom: 60px;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 2rem;
            color: #fff;
        }
        .info {
            color: #fff;
            font-size: 1.2rem;
            line-height: 1.8;
        }
        .mkdocs-link {
            display: inline-block;
            margin-top: 30px;
            margin-bottom: 60px;
            padding: 15px 30px;
            background: #fff;
            color: #27AE60;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
            border: 3px solid #fff;
            transition: all 0.3s ease;
        }
        .mkdocs-link:hover {
            background: transparent;
            color: #fff;
        }
        
        /* 蒙德里安风格照片墙 */
        .photo-wall-title {
            font-size: 2.5rem;
            color: #fff;
            margin: 60px 0 40px 0;
            font-weight: bold;
        }
        
        .photo-wall {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 200px);
            gap: 15px;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .photo-item {
            position: relative;
            overflow: hidden;
            border: 4px solid #000;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .photo-item:hover {
            transform: scale(1.05);
            z-index: 10;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        
        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        /* 不规则布局 */
        .photo-item:nth-child(1) {
            grid-column: span 2;
            grid-row: span 2;
        }
        
        .photo-item:nth-child(5) {
            grid-column: span 2;
        }
        
        .photo-item:nth-child(8) {
            grid-row: span 2;
        }
        
        @media (max-width: 768px) {
            .photo-wall {
                grid-template-columns: repeat(2, 1fr);
                grid-template-rows: auto;
            }
            
            .photo-item:nth-child(1) {
                grid-column: span 2;
                grid-row: span 1;
            }
        }
    </style>
</head>
