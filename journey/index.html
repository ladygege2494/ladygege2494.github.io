<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一路走来 - GegeNook</title>
    <link rel="icon" type="image/jpeg" href="../favicon.jpg">
    <link rel="stylesheet" href="../styles.css">
    <style>
        body {
            background: #27AE60;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            overflow-y: auto;
        }
        .journey-container {
            max-width: 1200px;
            width: 100%;
            text-align: center;
            margin-bottom: 60px;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 2rem;
            color: #fff;
        }
        .info {
            color: #fff;
            font-size: 1.2rem;
            line-height: 1.8;
        }
        .mkdocs-link {
            display: inline-block;
            margin-top: 30px;
            margin-bottom: 60px;
            padding: 15px 30px;
            background: #fff;
            color: #27AE60;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
            border: 3px solid #fff;
            transition: all 0.3s ease;
        }
        .mkdocs-link:hover {
            background: transparent;
            color: #fff;
        }
        
        /* 照片树样式 */
        .photo-wall-title {
            font-size: 2.5rem;
            color: #fff;
            margin: 60px 0 40px 0;
            font-weight: bold;
        }
        
        .tree-container {
            position: relative;
            width: 100%;
            max-width: 1200px;
            min-height: 800px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* 树干 */
        .tree-trunk {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 300px;
            background: linear-gradient(to bottom, #8B4513, #654321);
            border: 3px solid #000;
            border-radius: 30px 30px 0 0;
            z-index: 1;
        }
        
        /* 树冠（SVG 样式） */
        .tree-crown {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            height: 500px;
            z-index: 0;
        }
        
        /* 照片卡片 */
        .photo-card {
            position: absolute;
            width: 200px;
            height: 150px;
            background: #fff;
            border: 4px solid #000;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 2;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.2);
        }
        
        .photo-card:hover {
            transform: rotate(0deg) scale(1.1) !important;
            z-index: 10;
            box-shadow: 8px 8px 0 rgba(0,0,0,0.3);
        }
        
        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .photo-card::before {
            content: '';
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 30px;
            background: #8B4513;
            border-left: 2px dashed #654321;
        }
        
        /* 照片位置布局 */
        .photo-card:nth-child(1) {
            top: 100px;
            left: 150px;
            transform: rotate(-5deg);
        }
        
        .photo-card:nth-child(2) {
            top: 80px;
            right: 150px;
            transform: rotate(8deg);
        }
        
        .photo-card:nth-child(3) {
            top: 280px;
            left: 100px;
            transform: rotate(3deg);
        }
        
        .photo-card:nth-child(4) {
            top: 300px;
            right: 100px;
            transform: rotate(-7deg);
        }
        
        /* 树洞留言卡片 */
        .tree-hole-card {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            width: 280px;
            min-height: 200px;
            background: #fff;
            border: 4px solid #000;
            border-radius: 12px;
            padding: 20px;
            z-index: 3;
            box-shadow: 6px 6px 0 rgba(0,0,0,0.2);
        }
        
        .tree-hole-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #27AE60;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .tree-hole-textarea {
            width: 100%;
            min-height: 80px;
            padding: 10px;
            border: 2px solid #000;
            border-radius: 4px;
            font-size: 0.9rem;
            resize: vertical;
            font-family: inherit;
        }
        
        .tree-hole-btn {
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            background: #27AE60;
            color: #fff;
            border: 3px solid #000;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .tree-hole-btn:hover {
            background: #fff;
            color: #27AE60;
        }
        
        .tree-hole-messages {
            margin-top: 15px;
            max-height: 150px;
            overflow-y: auto;
        }
        
        .tree-hole-message {
            padding: 8px;
            background: #f0f0f0;
            border-left: 3px solid #27AE60;
            margin-bottom: 8px;
            font-size: 0.85rem;
            border-radius: 4px;
        }
        
        @media (max-width: 768px) {
            .tree-container {
                min-height: 600px;
            }
            
            .tree-crown {
                width: 350px;
                height: 350px;
            }
            
            .photo-card {
                width: 150px;
                height: 110px;
            }
            
            .tree-hole-card {
                width: 240px;
            }
        }
    </style>
</head>
<body>
    <!-- 全局导航栏 -->
    <div class="nav-hover-zone" id="navHoverZone"></div>
    <nav class="top-nav collapsed" id="globalNav">
        <div class="nav-left">
            <span class="nav-logo">
                <span class="letter-red">G</span><span class="letter-yellow">e</span><span class="letter-blue">g</span><span class="letter-black">e</span><span class="letter-red">N</span><span class="letter-yellow">o</span><span class="letter-blue">o</span><span class="letter-black">k</span>
            </span>
        </div>
        <div class="nav-center">
            <div class="nav-item" id="searchBtn">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </span>
                <span class="nav-text">搜索</span>
            </div>
            <div class="nav-item" onclick="window.location.href='../index.html#section2'">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                </span>
                <span class="nav-text">主页</span>
            </div>
            <div class="nav-item" onclick="window.location.href='../friends/'">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
                </span>
                <span class="nav-text">友链</span>
            </div>
            <div class="nav-item" onclick="window.location.href='../about/'">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>

            </div>

        <button class="nav-toggle" id="navToggle" aria-label="折叠导航" style="display: none;">﹀</button>
    </nav>

    <div class="search-box" id="searchBox">
        <input type="text" placeholder="搜索站内文章..." id="searchInput">
        <button class="search-close" id="searchClose">&times;</button>
    </div>

    <div class="journey-container">
        <h1>一路走来</h1>
        <div class="info">
            <p>记录个人生活与成长感悟，分享一路走来的点滴。</p>
            <p>内容将通过 MkDocs 网站展示，敬请期待。</p>
        </div>
        <a href="../notes/journey/site/index.html" class="mkdocs-link">进入 MkDocs 网站 →</a>
    </div>
    
    <!-- 照片树 -->
    <h2 class="photo-wall-title">🌳 成长之树</h2>
    <div class="tree-container">
        <!-- 树冠 SVG -->
        <svg class="tree-crown" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <circle cx="100" cy="100" r="90" fill="#2ECC71" stroke="#000" stroke-width="3"/>
            <circle cx="70" cy="80" r="50" fill="#27AE60" stroke="#000" stroke-width="2"/>
            <circle cx="130" cy="85" r="55" fill="#27AE60" stroke="#000" stroke-width="2"/>
            <circle cx="100" cy="130" r="60" fill="#229954" stroke="#000" stroke-width="2"/>
        </svg>
        
        <!-- 树干 -->
        <div class="tree-trunk"></div>
        
        <!-- 照片卡片 -->
        <div class="photo-card">
            <img src="fig/高中毕业.jpg" alt="高中毕业">
        </div>
        <div class="photo-card">
            <img src="fig/大一下成功考入工高.jpg" alt="考入工高">
        </div>
        <div class="photo-card">
            <img src="fig/19岁生日.jpg" alt="19岁生日">
        </div>
        <div class="photo-card">
            <img src="fig/告别大一加入的学生组织.jpg" alt="告别学生组织">
        </div>
        
        <!-- 树洞留言卡片 -->
        <div class="tree-hole-card">
            <div class="tree-hole-title">🍃 树洞留言</div>
            <textarea class="tree-hole-textarea" id="treeHoleInput" placeholder="写下你的心情..."></textarea>
            <button class="tree-hole-btn" onclick="submitTreeHoleMessage()">投入树洞</button>
            <div class="tree-hole-messages" id="treeHoleMessages"></div>
        </div>
    </div>
    
    <script>
        // 树洞留言功能
        function submitTreeHoleMessage() {
            const input = document.getElementById('treeHoleInput');
            const messagesDiv = document.getElementById('treeHoleMessages');
            const message = input.value.trim();
            
            if (!message) {
                alert('请输入留言内容');
                return;
            }
            
            // 保存到 localStorage
            const messages = JSON.parse(localStorage.getItem('treeHoleMessages') || '[]');
            messages.unshift({
                content: message,
                time: new Date().toLocaleString('zh-CN', {
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit'
                })
            });
            localStorage.setItem('treeHoleMessages', JSON.stringify(messages.slice(0, 20))); // 只保留最近20条
            
            // 清空输入框
            input.value = '';
            
            // 刷新显示
            loadTreeHoleMessages();
        }
        
        function loadTreeHoleMessages() {
            const messagesDiv = document.getElementById('treeHoleMessages');
            const messages = JSON.parse(localStorage.getItem('treeHoleMessages') || '[]');
            
            messagesDiv.innerHTML = messages.map(msg => `
                <div class="tree-hole-message">
                    <div style="font-size: 0.75rem; color: #666; margin-bottom: 4px;">${msg.time}</div>
                    <div>${msg.content}</div>
                </div>
            `).join('');
        }
        
        // 页面加载时显示留言
        document.addEventListener('DOMContentLoaded', loadTreeHoleMessages);
    </script>

    <!-- 页面切换加载动画 -->
    <div class="page-loader" id="pageLoader">
        <div class="loader-square">
            <div class="loader-inner-square red"></div>
            <div class="loader-inner-square yellow"></div>
            <div class="loader-inner-square blue"></div>
            <div class="loader-inner-square white"></div>
        </div>
    </div>

    <script src="../script.js"></script>
</body>
