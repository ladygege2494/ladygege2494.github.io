<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一路走来 - GegeNook</title>
    <link rel="icon" type="image/jpeg" href="../favicon.jpg">
    <link rel="stylesheet" href="../styles.css">
    <style>
        body {
            background: #27AE60;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            overflow-y: auto;
        }
        .journey-container {
            max-width: 1200px;
            width: 100%;
            text-align: center;
            margin-bottom: 60px;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 2rem;
            color: #fff;
        }
        .info {
            color: #fff;
            font-size: 1.2rem;
            line-height: 1.8;
        }
        .mkdocs-link {
            display: inline-block;
            margin-top: 30px;
            margin-bottom: 60px;
            padding: 15px 30px;
            background: #fff;
            color: #27AE60;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
            border: 3px solid #fff;
            transition: all 0.3s ease;
        }
        .mkdocs-link:hover {
            background: transparent;
            color: #fff;
        }
        
        /* 垂直时间轴样式 */
        .photo-wall-title {
            font-size: 2.5rem;
            color: #fff;
            margin: 60px 0 40px 0;
            font-weight: bold;
        }
        
        .timeline-container {
            position: relative;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 0;
        }
        
        /* 时间轴中线 */
        .timeline-container::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 4px;
            background: #2ECC71;
            transform: translateX(-50%);
        }
        
        /* 时间节点 */
        .timeline-item {
            position: relative;
            margin-bottom: 80px;
            width: 100%;
        }
        
        .timeline-item:last-child {
            margin-bottom: 0;
        }
        
        /* 左侧卡片 */
        .timeline-item.left .timeline-content {
            margin-left: 0;
            margin-right: calc(50% + 40px);
            text-align: right;
        }
        
        /* 右侧卡片 */
        .timeline-item.right .timeline-content {
            margin-left: calc(50% + 40px);
            margin-right: 0;
            text-align: left;
        }
        
        /* 内容卡片 */
        .timeline-content {
            background: #fff;
            border: 4px solid #000;
            border-radius: 12px;
            padding: 20px;
            position: relative;
            box-shadow: 6px 6px 0 rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }
        
        .timeline-content:hover {
            transform: translateY(-5px);
            box-shadow: 8px 8px 0 rgba(0,0,0,0.3);
        }
        
        /* 时间节点圆点 */
        .timeline-dot {
            position: absolute;
            left: 50%;
            top: 20px;
            transform: translateX(-50%);
            width: 30px;
            height: 30px;
            background: #27AE60;
            border: 5px solid #fff;
            border-radius: 50%;
            z-index: 2;
            box-shadow: 0 0 0 4px #27AE60;
        }
        
        /* 时间标签 */
        .timeline-year {
            position: absolute;
            left: 50%;
            top: 60px;
            transform: translateX(-50%);
            background: #2ECC71;
            color: #fff;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1.1rem;
            border: 3px solid #000;
            box-shadow: 3px 3px 0 rgba(0,0,0,0.2);
            z-index: 2;
        }
        
        /* 照片 */
        .timeline-photo {
            width: 100%;
            max-width: 300px;
            height: 200px;
            object-fit: cover;
            border: 3px solid #000;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        
        .timeline-item.left .timeline-photo {
            float: right;
        }
        
        .timeline-item.right .timeline-photo {
            float: left;
        }
        
        /* 事件标题 */
        .timeline-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: #27AE60;
            margin-bottom: 10px;
            clear: both;
        }
        
        /* 事件描述 */
        .timeline-desc {
            color: #666;
            line-height: 1.6;
            font-size: 0.95rem;
        }
        
        /* 树洞留言卡片 */
        .tree-hole-card {
            max-width: 500px;
            margin: 60px auto 0;
            background: #fff;
            border: 4px solid #000;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 6px 6px 0 rgba(0,0,0,0.2);
        }
        
        .tree-hole-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #27AE60;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .tree-hole-textarea {
            width: 100%;
            min-height: 80px;
            padding: 12px;
            border: 2px solid #000;
            border-radius: 6px;
            font-size: 0.95rem;
            resize: vertical;
            font-family: inherit;
        }
        
        .tree-hole-btn {
            width: 100%;
            margin-top: 12px;
            padding: 12px;
            background: #27AE60;
            color: #fff;
            border: 3px solid #000;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .tree-hole-btn:hover {
            background: #2ECC71;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        
        .tree-hole-messages {
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
        }
        
        .tree-hole-message {
            padding: 10px;
            background: #f0f0f0;
            border-left: 4px solid #27AE60;
            margin-bottom: 10px;
            font-size: 0.9rem;
            border-radius: 4px;
        }
        
        @media (max-width: 768px) {
            .timeline-container::before {
                left: 30px;
            }
            
            .timeline-dot {
                left: 30px;
            }
            
            .timeline-year {
                left: 30px;
            }
            
            .timeline-item.left .timeline-content,
            .timeline-item.right .timeline-content {
                margin-left: 80px;
                margin-right: 0;
                text-align: left;
            }
            
            .timeline-item.left .timeline-photo,
            .timeline-item.right .timeline-photo {
                float: none;
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- 全局导航栏 -->
    <div class="nav-hover-zone" id="navHoverZone"></div>
    <nav class="top-nav collapsed" id="globalNav">
        <div class="nav-left">
            <span class="nav-logo">
                <span class="letter-red">G</span><span class="letter-yellow">e</span><span class="letter-blue">g</span><span class="letter-black">e</span><span class="letter-red">N</span><span class="letter-yellow">o</span><span class="letter-blue">o</span><span class="letter-black">k</span>
            </span>
        </div>
        <div class="nav-center">
            <div class="nav-item" id="searchBtn">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </span>
                <span class="nav-text">搜索</span>
            </div>
            <div class="nav-item" onclick="window.location.href='../index.html#section2'">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                </span>
                <span class="nav-text">主页</span>
            </div>
            <div class="nav-item" onclick="window.location.href='../friends/'">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
                </span>
                <span class="nav-text">友链</span>
            </div>
            <div class="nav-item" onclick="window.location.href='../about/'">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                </span>
                <span class="nav-text">关于</span>
            </div>
        </div>
        <button class="nav-toggle" id="navToggle" aria-label="折叠导航" style="display: none;">﹀</button>
    </nav>

    <div class="search-box" id="searchBox">
        <input type="text" placeholder="搜索站内文章..." id="searchInput">
        <button class="search-close" id="searchClose">&times;</button>
    </div>

    <div class="journey-container">
        <h1>一路走来</h1>
        <div class="info">
            <p>记录个人生活与成长感悟，分享一路走来的点滴。</p>
            <p>内容将通过 MkDocs 网站展示，敬请期待。</p>
        </div>
        <a href="../notes/journey/index.html" class="mkdocs-link">进入 MkDocs 网站 →</a>
    </div>
    
    <!-- 垂直时间轴 -->
    <h2 class="photo-wall-title">⏳ 成长时间轴</h2>
    <div class="timeline-container">
        <!-- 2023 -->
        <div class="timeline-item left">
            <div class="timeline-dot"></div>
            <div class="timeline-year">2023</div>
            <div class="timeline-content">
                <img src="fig/告别大一加入的学生组织.jpg" alt="告别学生组织" class="timeline-photo">
                <div class="timeline-title">告别大一加入的学生组织</div>
                <div class="timeline-desc">结束了充实而难忘的学生组织时光，带着满满的收获和美好回忆开启新的篇章。</div>
            </div>
        </div>
        
        <!-- 2022 -->
        <div class="timeline-item right">
            <div class="timeline-dot"></div>
            <div class="timeline-year">2022</div>
            <div class="timeline-content">
                <img src="fig/19岁生日.jpg" alt="19岁生日" class="timeline-photo">
                <div class="timeline-title">19岁生日</div>
                <div class="timeline-desc">迎来了19岁生日，成人的第一个生日，充满期待和希望的新征程。</div>
            </div>
        </div>
        
        <!-- 2021 -->
        <div class="timeline-item left">
            <div class="timeline-dot"></div>
            <div class="timeline-year">2021</div>
            <div class="timeline-content">
                <img src="fig/大一下成功考入工高.jpg" alt="考入工高" class="timeline-photo">
                <div class="timeline-title">大一下成功考入工高</div>
                <div class="timeline-desc">通过努力与坚持，成功考入工高，开启全新的学习之旅。</div>
            </div>
        </div>
        
        <!-- 2020 -->
        <div class="timeline-item right">
            <div class="timeline-dot"></div>
            <div class="timeline-year">2020</div>
            <div class="timeline-content">
                <img src="fig/高中毕业.jpg" alt="高中毕业" class="timeline-photo">
                <div class="timeline-title">高中毕业</div>
                <div class="timeline-desc">告别高中时代，带着梦想和期待踏入大学校门，开启人生新的阶段。</div>
            </div>
        </div>
    </div>
    
    <!-- 树洞留言卡片 -->
    <div class="tree-hole-card">
        <div class="tree-hole-title">🍃 树洞留言</div>
        <textarea class="tree-hole-textarea" id="treeHoleInput" placeholder="写下你的心情..."></textarea>
        <button class="tree-hole-btn" onclick="submitTreeHoleMessage()">投入树洞</button>
        <div class="tree-hole-messages" id="treeHoleMessages"></div>
    </div>
    
    <script>
        // 树洞留言功能
        function submitTreeHoleMessage() {
            const input = document.getElementById('treeHoleInput');
            const messagesDiv = document.getElementById('treeHoleMessages');
            const message = input.value.trim();
            
            if (!message) {
                alert('请输入留言内容');
                return;
            }
            
            // 保存到 localStorage
            const messages = JSON.parse(localStorage.getItem('treeHoleMessages') || '[]');
            messages.unshift({
                content: message,
                time: new Date().toLocaleString('zh-CN', {
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit'
                })
            });
            localStorage.setItem('treeHoleMessages', JSON.stringify(messages.slice(0, 20))); // 只保留最近20条
            
            // 清空输入框
            input.value = '';
            
            // 刷新显示
            loadTreeHoleMessages();
        }
        
        function loadTreeHoleMessages() {
            const messagesDiv = document.getElementById('treeHoleMessages');
            const messages = JSON.parse(localStorage.getItem('treeHoleMessages') || '[]');
            
            messagesDiv.innerHTML = messages.map(msg => `
                <div class="tree-hole-message">
                    <div style="font-size: 0.75rem; color: #666; margin-bottom: 4px;">${msg.time}</div>
                    <div>${msg.content}</div>
                </div>
            `).join('');
        }
        
        // 页面加载时显示留言
        document.addEventListener('DOMContentLoaded', loadTreeHoleMessages);
    </script>

    <!-- 页面切换加载动画 -->
    <div class="page-loader" id="pageLoader">
        <div class="loader-square">
            <div class="loader-inner-square red"></div>
            <div class="loader-inner-square yellow"></div>
            <div class="loader-inner-square blue"></div>
            <div class="loader-inner-square white"></div>
        </div>
    </div>

    <script src="../script.js"></script>
</body>
</html>
