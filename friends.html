<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>友链 - 不拘一格</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background: #000;
            min-height: 100vh;
            padding: 0;
            margin: 0;
            font-family: 'Arial', 'Helvetica', 'Microsoft YaHei', sans-serif;
            overflow-x: hidden;
        }
        
        .friends-container {
            width: 90%;
            max-width: 1400px;
            margin: 100px auto 40px;
            padding: 20px;
            background: #fff;
            border: 8px solid #000;
        }
        
        .friends-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-auto-rows: 150px;
            gap: 12px;
            background: #000;
            padding: 12px;
            border: 4px solid #000;
        }
        
        .friend-card {
            background: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            overflow: hidden;
            position: relative;
            border: 4px solid #000;
        }
        
        .friend-card:hover {
            z-index: 10;
            transform: translate(-4px, -4px);
            box-shadow: 8px 8px 0 #000;
        }
        
        /* 蒙德里安颜色类 */
        .friend-red { background-color: #e30512; color: #fff; }
        .friend-blue { background-color: #044ea2; color: #fff; }
        .friend-yellow { background-color: #facd01; color: #000; }
        .friend-white { background-color: #ffffff; color: #000; }
        
        /* 不同尺寸的卡片 */
        .friend-card.size-lg { grid-column: span 2; grid-row: span 2; }
        .friend-card.size-wide { grid-column: span 2; grid-row: span 1; }
        .friend-card.size-tall { grid-column: span 1; grid-row: span 2; }
        .friend-card.size-sm { grid-column: span 1; grid-row: span 1; }
        
        .friend-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid #000;
            margin-bottom: 10px;
            overflow: hidden;
            background: #fff;
        }
        
        .friend-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .friend-name {
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 1px;
        }
        
        .friend-desc {
            font-size: 0.8rem;
            opacity: 0.8;
            margin-top: 5px;
        }
        
        /* 评论区样式 */
        .comments-section {
            margin-top: 60px;
            padding: 40px;
            background: #f8f9fa;
            border-top: 8px solid #000;
        }
        
        .comments-title {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 30px;
            color: #000;
        }
        
        .comments-stats {
            margin-bottom: 30px;
            text-align: center;
            color: #666;
            font-size: 1.1rem;
        }
        
        .comment-input-box {
            border: 2px solid #ddd;
            border-radius: 8px;
            background: #fff;
            overflow: hidden;
        }
        
        .comment-tabs {
            display: flex;
            border-bottom: 1px solid #eee;
            background: #fafafa;
        }
        
        .comment-tab {
            padding: 12px 24px;
            font-size: 0.95rem;
            cursor: pointer;
            border-right: 1px solid #eee;
        }
        
        .comment-tab.active {
            background: #fff;
            font-weight: bold;
            border-bottom: 2px solid #000;
        }
        
        .comment-textarea {
            width: 100%;
            min-height: 150px;
            padding: 20px;
            border: none;
            resize: vertical;
            font-size: 1rem;
            outline: none;
        }
        
        .comment-footer {
            padding: 15px 20px;
            background: #fafafa;
            display: flex;
            justify-content: flex-end;
            border-top: 1px solid #eee;
        }
        
        .btn-github {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            background: #2ea44f;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: background 0.2s;
        }
        
        .btn-github:hover {
            background: #2c974b;
        }
        
        @media (max-width: 1024px) {
            .friends-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
        
        @media (max-width: 768px) {
            .friends-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .friends-container {
                width: 95%;
                margin-top: 80px;
            }
        }
    </style>
</head>
