<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>友链 - GegeNook</title>
    <link rel="icon" type="image/jpeg" href="favicon.jpg">
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background: #000;
            min-height: 100vh;
            padding: 0;
            margin: 0;
            font-family: 'Arial', 'Helvetica', 'Microsoft YaHei', sans-serif;
            overflow-x: hidden;
        }
        
        .friends-container {
            width: 90%;
            max-width: 1400px;
            margin: 100px auto 40px;
            padding: 20px;
            background: #fff;
            border: 8px solid #000;
        }
        
        .friends-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-auto-rows: 150px;
            gap: 12px;
            background: #000;
            padding: 12px;
            border: 4px solid #000;
        }
        
        .friend-card {
            background: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            overflow: hidden;
            position: relative;
            border: 4px solid #000;
        }
        
        .friend-card:hover {
            z-index: 10;
            transform: translate(-4px, -4px);
            box-shadow: 8px 8px 0 #000;
        }
        
        /* 蒙德里安颜色类 */
        .friend-red { background-color: #e30512; color: #fff; }
        .friend-blue { background-color: #044ea2; color: #fff; }
        .friend-yellow { background-color: #facd01; color: #000; }
        .friend-white { background-color: #ffffff; color: #000; }
        
        /* 不同尺寸的卡片 */
        .friend-card.size-lg { grid-column: span 2; grid-row: span 2; }
        .friend-card.size-wide { grid-column: span 2; grid-row: span 1; }
        .friend-card.size-tall { grid-column: span 1; grid-row: span 2; }
        .friend-card.size-sm { grid-column: span 1; grid-row: span 1; }
        
        .friend-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid #000;
            margin-bottom: 10px;
            overflow: hidden;
            background: #fff;
        }
        
        .friend-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .friend-name {
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 1px;
        }
        
        .friend-desc {
            font-size: 0.8rem;
            opacity: 0.8;
            margin-top: 5px;
        }
        
        /* 评论区样式 */
        .comments-section {
            margin-top: 60px;
            padding: 40px;
            background: #f8f9fa;
            border-top: 8px solid #000;
        }
        
        .comments-title {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 30px;
            color: #000;
        }
        
        .comments-stats {
            margin-bottom: 30px;
            text-align: center;
            color: #666;
            font-size: 1.1rem;
        }
        
        .comment-input-box {
            border: 2px solid #ddd;
            border-radius: 8px;
            background: #fff;
            overflow: hidden;
        }
        
        .comment-tabs {
            display: flex;
            border-bottom: 1px solid #eee;
            background: #fafafa;
        }
        
        .comment-tab {
            padding: 12px 24px;
            font-size: 0.95rem;
            cursor: pointer;
            border-right: 1px solid #eee;
        }
        
        .comment-tab.active {
            background: #fff;
            font-weight: bold;
            border-bottom: 2px solid #000;
        }
        
        .comment-textarea {
            width: 100%;
            min-height: 150px;
            padding: 20px;
            border: none;
            resize: vertical;
            font-size: 1rem;
            outline: none;
        }
        
        .comment-footer {
            padding: 15px 20px;
            background: #fafafa;
            display: flex;
            justify-content: flex-end;
            border-top: 1px solid #eee;
        }
        
        .btn-github {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            background: #2ea44f;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: background 0.2s;
        }
        
        .btn-github:hover {
            background: #2c974b;
        }
        
        @media (max-width: 1024px) {
            .friends-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
        
        @media (max-width: 768px) {
            .friends-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .friends-container {
                width: 95%;
                margin-top: 80px;
            }
        }
    </style>
</head>
<body>
    <!-- 全局导航栏 -->
    <div class="nav-hover-zone" id="navHoverZone"></div>
    <nav class="top-nav collapsed" id="globalNav">
        <div class="nav-left">
            <span class="nav-logo">GegeNook</span>
        </div>
        <div class="nav-center">
            <div class="nav-item" id="searchBtn">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </span>
                <span class="nav-text">搜索</span>
            </div>
            <div class="nav-item" onclick="window.location.href='index.html#section2'">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                </span>
                <span class="nav-text">主页</span>
            </div>
            <div class="nav-item" onclick="window.location.href='friends.html'">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
                </span>
                <span class="nav-text">友链</span>
            </div>
            <div class="nav-item" onclick="window.location.href='about.html'">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                </span>
                <span class="nav-text">关于</span>
            </div>
        </div>
        <button class="nav-toggle" id="navToggle" aria-label="折叠导航" style="display: none;">﹀</button>
    </nav>

    <div class="search-box" id="searchBox">
        <input type="text" placeholder="搜索站内文章..." id="searchInput">
        <button class="search-close" id="searchClose">&times;</button>
    </div>
    
    <div class="friends-container">
        <div class="friends-grid">
            <a href="#" class="friend-card friend-red size-lg">
                <div class="friend-avatar">
                    <div style="background: #fff; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: #e30512; font-weight: bold;">B</div>
                </div>
                <div class="friend-name">Bixing's Note</div>
                <div class="friend-desc">个人博客</div>
            </a>
            
            <a href="#" class="friend-card friend-blue size-wide">
                <div class="friend-name">Jiepeng's Note</div>
                <div class="friend-desc">技术分享</div>
            </a>
            
            <a href="#" class="friend-card friend-white size-sm">
                <div class="friend-name">Tstum</div>
            </a>
            
            <a href="#" class="friend-card friend-yellow size-tall">
                <div class="friend-avatar">
                    <div style="background: #000; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: #facd01; font-weight: bold;">J</div>
                </div>
                <div class="friend-name">BruceJin</div>
                <div class="friend-desc">前端开发</div>
            </a>
            
            <a href="#" class="friend-card friend-white size-wide">
                <div class="friend-name">末茶Mo_Tu</div>
                <div class="friend-desc">设计思考</div>
            </a>
            
            <a href="#" class="friend-card friend-red size-sm">
                <div class="friend-name">zzw4257</div>
            </a>
            
            <a href="#" class="friend-card friend-blue size-tall">
                <div class="friend-name">Aurora0Lian</div>
                <div class="friend-desc">个人网站</div>
            </a>
            
            <a href="#" class="friend-card friend-white size-lg">
                <div class="friend-avatar">
                    <div style="background: #facd01; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: #000; font-weight: bold;">W</div>
                </div>
                <div class="friend-name">Withflow</div>
                <div class="friend-desc">创意分享</div>
            </a>
        </div>

        <!-- 评论区 -->
        <div class="comments-section">
            <h2 class="comments-title">Comments</h2>
            
            <div class="comments-stats" id="commentsStats">
                <p id="commentCount">0 条评论</p>
                <div style="font-size: 2rem; margin-top: 10px;">😊</div>
            </div>

            <div class="comment-input-box">
                <div class="comment-tabs">
                    <div class="comment-tab active">输入</div>
                    <div class="comment-tab">预览</div>
                </div>
                <textarea class="comment-textarea" id="commentTextarea" placeholder="写下你的评论..."></textarea>
                <div class="comment-footer">
                    <button id="commentSubmitBtn" class="btn-submit">
                        📝 发表评论
                    </button>
                </div>
            </div>
            
            <div id="commentsList" style="margin-top: 30px;">
                <!-- 评论将在这里动态生成 -->
            </div>
        </div>
    </div>

    <!-- 署名编辑弹窗 -->
    <div class="name-modal" id="nameModal">
        <div class="name-modal-content">
            <h3>👤 请留下你的署名</h3>
            <input type="text" id="nameInput" placeholder="输入你的昵称..." maxlength="20">
            <div class="name-modal-actions">
                <button id="nameConfirm">确定</button>
                <button id="nameCancel">取消</button>
            </div>
        </div>
    </div>

    <style>
        .btn-submit {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            background: #2ea44f;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-submit:hover {
            background: #2c974b;
        }
        
        .name-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 3000;
        }
        .name-modal.active {
            display: flex;
        }
        .name-modal-content {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            border: 4px solid #000;
        }
        .name-modal-content h3 {
            margin-bottom: 20px;
            font-size: 1.3rem;
            color: #000;
        }
        .name-modal-content input {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border: 2px solid #000;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        .name-modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .name-modal-actions button {
            padding: 10px 20px;
            border: 2px solid #000;
            background: #000;
            color: #fff;
            cursor: pointer;
            font-weight: bold;
            border-radius: 6px;
            transition: all 0.2s ease;
        }
        .name-modal-actions button:last-child {
            background: #fff;
            color: #000;
        }
        .name-modal-actions button:hover {
            transform: translateY(-2px);
        }
        
        .comment-item {
            background: #fff;
            border: 4px solid #000;
            padding: 20px;
            margin-bottom: 20px;
        }
        .comment-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .comment-avatar {
            width: 40px;
            height: 40px;
            background: #000;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border-radius: 4px;
        }
        .comment-author {
            font-weight: bold;
        }
        .comment-time {
            font-size: 0.8rem;
            color: #666;
            margin-left: auto;
        }
        .comment-content {
            line-height: 1.6;
            color: #333;
        }
    </style>
        </div>
    </div>

    <!-- 页面切换加载动画 -->
    <div class="page-loader" id="pageLoader">
        <div class="loader-square">
            <div class="loader-inner-square red"></div>
            <div class="loader-inner-square yellow"></div>
            <div class="loader-inner-square blue"></div>
            <div class="loader-inner-square white"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
