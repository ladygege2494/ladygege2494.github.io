    <style>
        body {
            background: #000;
            min-height: 100vh;
            padding: 0;
            margin: 0;
            font-family: 'Arial', 'Helvetica', 'Microsoft YaHei', sans-serif;
            overflow-x: hidden;
        }
        
        .friends-container {
            width: 90%;
            max-width: 1400px;
            margin: 100px auto 40px;
            padding: 20px;
            background: #fff;
            border: 8px solid #000;
        }
        
        .friends-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-auto-rows: 150px;
            gap: 12px;
            background: #000;
            padding: 12px;
            border: 4px solid #000;
        }
        
        .friend-card {
            background: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            overflow: hidden;
            position: relative;
            border: 4px solid #000;
        }
        
        .friend-card:hover {
            z-index: 10;
            transform: translate(-4px, -4px);
            box-shadow: 8px 8px 0 #000;
        }
        
        /* 蒙德里安颜色类 */
        .friend-red { background-color: #e30512; color: #fff; }
        .friend-blue { background-color: #044ea2; color: #fff; }
        .friend-yellow { background-color: #facd01; color: #000; }
        .friend-white { background-color: #ffffff; color: #000; }
        
        /* 不同尺寸的卡片 */
        .friend-card.size-lg { grid-column: span 2; grid-row: span 2; }
        .friend-card.size-wide { grid-column: span 2; grid-row: span 1; }
        .friend-card.size-tall { grid-column: span 1; grid-row: span 2; }
        .friend-card.size-sm { grid-column: span 1; grid-row: span 1; }
        
        .friend-name {
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 1px;
            padding: 12px;
        }
        
        .friends-actions,
        .comments-section {
            padding: clamp(24px, 4vw, 44px);
            border-top: 8px solid #000;
        }

        .friends-actions {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 28px;
            align-items: center;
            margin-top: 20px;
            background: #facd01;
        }

        .friends-actions h2,
        .comments-title {
            margin: 0 0 10px;
            color: #000;
            font-size: clamp(1.6rem, 3vw, 2.2rem);
            font-weight: 800;
        }

        .friends-actions p,
        .comments-hint {
            max-width: 720px;
            margin: 0;
            color: #333;
            line-height: 1.7;
        }

        .friend-apply-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 170px;
            padding: 14px 20px;
            border: 4px solid #000;
            background: #044ea2;
            color: #fff;
            font-weight: 800;
            text-decoration: none;
            box-shadow: 6px 6px 0 #000;
            transition: transform 150ms ease, box-shadow 150ms ease;
        }

        .friend-apply-button:hover {
            color: #fff;
            transform: translate(3px, 3px);
            box-shadow: 3px 3px 0 #000;
        }

        .comments-section {
            background: #f8f9fa;
        }

        .comments-title {
            margin-bottom: 6px;
        }

        .comments-hint {
            margin-bottom: 24px;
            color: #666;
        }
        
        @media (max-width: 1024px) {
            .friends-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
        
        @media (max-width: 768px) {
            .friends-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .friends-container {
                width: 95%;
                margin-top: 80px;
            }
            .friends-actions {
                grid-template-columns: 1fr;
            }
            .friend-apply-button {
                width: 100%;
            }
        }
    </style>
</head>
