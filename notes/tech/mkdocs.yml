site_name: 技术笔记
site_url: https://ladygege2494.github.io/notes/tech/
site_description: GegeNook 的技术、工程与课程笔记
site_author: LadyGege
theme:
  name: material
  language: zh
  favicon: /favicon.jpg
  icon:
    logo: material/chip
  custom_dir: ../overrides
  font: false
  palette:
    - scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: 切换至深色模式
    - scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: 切换至浅色模式
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - content.tooltips
extra:
  homepage: /tech/
extra_css:
  - /assets/mkdocs-extra.css?v=20260827-3
extra_javascript:
  - /assets/mkdocs.js
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
plugins:
  - search:
      lang: zh
      separator: '[\s\-，。；：！？、（）【】《》]+'
      fields:
        title:
          boost: 1000
        text:
          boost: 1
        tags:
          boost: 30
