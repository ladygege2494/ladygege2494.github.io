site_name: 技术笔记
site_url: https://ladygege2494.github.io/notes/tech/
site_description: GegeNook 的技术、工程与课程笔记
site_author: LadyGege
theme:
  name: material
  language: zh
  favicon: /favicon.jpg
  icon:
    logo: material/chip
  custom_dir: ../overrides
  font: false
  palette:
    - scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: 切换至深色模式
    - scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: 切换至浅色模式
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - content.tooltips
extra:
  homepage: /tech/
extra_css:
  - /assets/mkdocs-extra.css
extra_javascript:
  - /assets/mkdocs.js
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
plugins:
  - search:
      lang: zh
      separator: '[\s\-，。；：！？、（）【】《》]+'
      fields:
        title:
          boost: 1000
        text:
          boost: 1
        tags:
          boost: 30
nav:
  - Home: index.md
  - ISEE:
    - ISEE/index.md
    - "电子电路基础": ISEE/电子电路基础.md
    - "电设实验I": ISEE/电设实验I.md
  - CS:
    - CS/index.md
    - "C程设计基础与实验": CS/C程设计基础与实验.md
  - AI: AI/index.md
  - Me:
    - Me/index.md
    - "工程图学": Me/工程图学.md
  - Math:
    - Math/index.md
    - "复变函数与积分变换": Math/复变函数与积分变换.md
    - "常微分方程": Math/常微分方程.md
    - "微积分甲I": Math/微积分甲I.md
    - "微积分甲II": Math/微积分甲II.md
    - "数学建模": Math/数学建模.md
    - "概率论与数理统计": Math/概率论与数理统计.md
    - "线性代数": Math/线性代数.md
  - Physics:
    - Physics/index.md
    - "大学物理实验": Physics/大学物理实验.md
    - "大学物理甲I": Physics/大学物理甲I.md
    - "大学物理甲II": Physics/大学物理甲II.md
  - Other:
    - Other/index.md
    - "Git": Other/Git.md
  - 通识:
    - 通识/index.md
    - "专业类通识": 通识/专业类.md
    - "外语类汇总": 通识/外语类.md
    - "思政类汇总": 通识/思政类.md
    - "除思政外其他汇总": 通识/其他.md
